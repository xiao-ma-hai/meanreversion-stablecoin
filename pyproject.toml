[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meanrev-stablecoin"
version = "0.1.0"
description = "Reproducible USDT/USD mean-reversion empirical pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "statsmodels",
  "scikit-learn",
  "matplotlib",
  "pyarrow",
  "joblib",
  "PyYAML",
  "sympy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
